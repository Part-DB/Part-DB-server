oauth2_server:
    resource: '@LeagueOAuth2ServerBundle/config/routes.php'
    type: php
    # Only load the OAuth2 authorization server's own routes (/authorize, /token, /device-code) if the
    # OAuth2 server is enabled - disabled by default, see .env's OAUTH_SERVER_ENABLED.
    condition: "env('bool:OAUTH_SERVER_ENABLED') == true"
