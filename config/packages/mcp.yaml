mcp:
    app: "Part-DB"
    version: "0.1.0"
    description: "Part-DB is a inventory management database for electronic parts."
    instructions: |
        This server provides inventory information for your current user. It is mostly used for electronic parts,
        but can be used for any kind of inventory. The stored objects are called parts.
        If you miss some information from an search endpoint, try to retrieve more details using the ID of an entity.

    client_transports:
        http: true
        stdio: false
    http:
        path: "/mcp"
        # The MCP SDK's own DNS-rebinding protection only allows "localhost" by default, which would reject the
        # Host header of any real deployment. We disable it here and rely on framework.trusted_hosts (configured via
        # the TRUSTED_HOSTS env var, see config/packages/framework.yaml) instead, which already validates the Host
        # header for every request, MCP included.
        allowed_hosts: false
        session:
            store: "file"
            directory: "%kernel.cache_dir%/mcp"
            ttl: 3600
